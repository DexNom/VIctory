name: Signer check

# Checks the release signer (server/release-signer) end to end without releasing anything: a pushed tag
# signer-check-<n> asks it, with this run's GitHub OIDC token, to sign a fixed text, and verifies the signature
# with the public keys the launcher trusts (launcher/ReleaseKey.cs).
#   git tag signer-check-1 && git push <remote> signer-check-1

on:
  push:
    tags: ['signer-check-*']

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask the signer and verify
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=vi-release-signer").value
          $r = Invoke-RestMethod -Method Post -Uri 'https://vi-release-signer.edupodept.workers.dev/v1/check' -Headers @{ Authorization = "Bearer $token" } -Body ''
          $keys = [regex]::Matches((Get-Content launcher/ReleaseKey.cs -Raw), '"(<RSAKeyValue>.*?</RSAKeyValue>)"') | ForEach-Object { $_.Groups[1].Value }
          $ok = $false
          foreach ($k in $keys) {
            $rsa = [System.Security.Cryptography.RSA]::Create(); $rsa.FromXmlString($k)
            if ($rsa.VerifyData([Text.Encoding]::UTF8.GetBytes($r.text), [Convert]::FromBase64String($r.signature), 'SHA256', [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)) { $ok = $true }
          }
          "signed text: $($r.text)"
          if (-not $ok) { throw 'The signature does not match a key the launcher trusts.' }
          'The signer signs with a key the launcher trusts.'
